name: github-pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # enablement=auto：若仓库尚未启用 Pages，则自动启用并将构建源设为 GitHub Actions
      - uses: actions/configure-pages@v5
        with:
          enablement: auto
      - name: Prepare publish dir
        run: |
          mkdir -p .publish
          cp index.html data.json .publish/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .publish
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
